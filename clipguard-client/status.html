<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AskLens Clip Guard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0a0a0a;
    color: #e5e5e5;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid #1f1f1f;
  }
  .brand { font-size: 15px; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; }
  .status-line { margin-top: 6px; font-size: 13px; color: #9ca3af; }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  .empty {
    padding: 40px 20px;
    text-align: center;
    color: #6b7280;
    font-size: 13px;
    line-height: 1.6;
  }
  .row {
    padding: 12px 20px;
    border-bottom: 1px solid #161616;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .row-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .url { font-size: 13px; color: #e5e5e5; word-break: break-all; }
  .badge { flex-shrink: 0; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.03em; }
  .badge.safe { background: #052e16; color: #4ade80; }
  .badge.suspicious { background: #422006; color: #fbbf24; }
  .badge.malicious { background: #450a0a; color: #f87171; }
  .badge.dangerous { background: #450a0a; color: #f87171; }
  .badge.unknown, .badge.unavailable, .badge.checking { background: #262626; color: #a3a3a3; }
  .kind { font-size: 11px; color: #525252; text-transform: uppercase; letter-spacing: 0.04em; }
  .miners { font-size: 12px; color: #737373; }
  .time { font-size: 11px; color: #525252; }
  footer {
    padding: 10px 20px;
    border-top: 1px solid #1f1f1f;
    font-size: 11px;
    color: #525252;
    text-align: center;
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>AskLens Clip Guard</div>
  <div class="status-line" id="status">Ready — checking links and wallet addresses you copy</div>
</header>
<main id="list">
  <div class="empty">Copy a link (http:// or https://) or a wallet address (0x...) and it shows up here checked in real time, against live Telegraph miners.</div>
</main>
<footer>Runs in the background. Closing this window keeps it checking, use the tray icon to quit.</footer>
<script>
  const { ipcRenderer } = require("electron");
  const list = document.getElementById("list");
  const statusEl = document.getElementById("status");
  let hasEntries = false;

  const READY = "Ready — checking links and wallet addresses you copy";

  function rowFor(key) {
    return list.querySelector(`.row[data-key="${cssEscape(key)}"]`);
  }

  function addChecking(key, kind) {
    if (!hasEntries) { list.innerHTML = ""; hasEntries = true; }
    const row = document.createElement("div");
    row.className = "row";
    row.dataset.key = key;
    row.innerHTML = `
      <div class="row-top">
        <span class="url">${escapeHtml(key)}</span>
        <span class="badge checking">Checking</span>
      </div>
      <div class="kind">${kind === "address" ? "Wallet address" : "Link"}</div>
      <div class="miners">Asking Telegraph miners...</div>
    `;
    list.prepend(row);
    statusEl.textContent = kind === "address" ? "Checking a copied address..." : "Checking a copied link...";
  }

  function updateResult(key, overall, detail) {
    statusEl.textContent = READY;
    const row = rowFor(key);
    if (!row) return;
    const badge = row.querySelector(".badge");
    badge.className = `badge ${overall}`;
    badge.textContent = overall;
    row.querySelector(".miners").textContent = detail;
    const time = document.createElement("div");
    time.className = "time";
    time.textContent = new Date().toLocaleTimeString();
    row.appendChild(time);
  }

  function updateError(key, message) {
    statusEl.textContent = READY;
    const row = rowFor(key);
    if (!row) return;
    const badge = row.querySelector(".badge");
    badge.className = "badge unavailable";
    badge.textContent = "error";
    row.querySelector(".miners").textContent = message;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function cssEscape(s) {
    return s.replace(/["\\]/g, "\\$&");
  }

  ipcRenderer.on("checking", (_e, { key, kind }) => addChecking(key, kind));
  ipcRenderer.on("result", (_e, { key, overall, detail }) => updateResult(key, overall, detail));
  ipcRenderer.on("error", (_e, { key, message }) => updateError(key, message));
</script>
</body>
</html>
